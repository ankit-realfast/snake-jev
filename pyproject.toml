[project]
name = "snake-jev"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
snake = "snake.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snake"]
